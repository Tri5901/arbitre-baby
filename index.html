<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arbitre Baby">
<meta name="description" content="Chrono et score pour arbitrer un match de baby-foot">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Arbitre Baby</title>
<style>
/* Polices embarquées (dossier fonts/, licence OFL) : l'appli s'affiche tout de suite, même sans réseau */
@font-face{font-family:Barlow;font-weight:500;font-display:swap;src:url(fonts/barlow-500.woff2) format('woff2')}
@font-face{font-family:Barlow;font-weight:600;font-display:swap;src:url(fonts/barlow-600.woff2) format('woff2')}
@font-face{font-family:Barlow;font-weight:700;font-display:swap;src:url(fonts/barlow-700.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-600.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-700.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-800.woff2) format('woff2')}
body{margin:0}
/* Layout: pupitre noir qui tient sur un écran de téléphone sans défilement. Les hauteurs suivent la hauteur de l'écran (dvh). */
:root{
  color-scheme:dark;
  --bg:#000000; --fg:#f5f6f8; --muted:#8b929b; --line:rgba(255,255,255,.07);
  --surface:#111317; --surface-2:#1a1d22; --surface-3:#23272d;
  --t0:#ff7a1a; --t0-a:#ff9142; --t0-b:#e5600a; --on-t0:#ffffff;
  --t1:#c4cad2; --t1-a:#dde1e6; --t1-b:#9ba3ad; --on-t1:#14171b;
  --accent:#ffd23f; --on-accent:#1f1800;
  --stop:#ff5d5d; --stop-bg:rgba(255,93,93,.14);
  --go-a:#3ddc7e; --go-b:#17a54d; --on-go:#032712; --go:#2bc866;
  --font:Barlow,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --num:'Barlow Condensed',Barlow,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  background:radial-gradient(120% 45% at 50% -8%,rgba(255,122,26,.13),transparent 70%),var(--bg);
  background-attachment:fixed;color:var(--fg);font:500 15px/1.25 var(--font)
}
.app{
  max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;
  display:grid;grid-template-rows:auto auto minmax(190px,1fr) auto auto auto auto auto;gap:8px;
  padding-top:max(6px,env(safe-area-inset-top,0px));
  padding-bottom:max(8px,env(safe-area-inset-bottom,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px));
  padding-right:max(12px,env(safe-area-inset-right,0px));
}
button,input{font:inherit;color:inherit}
button{border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border-radius:14px;background:var(--surface-2);transition:transform .08s,filter .15s}
button:active{transform:scale(.96);filter:brightness(1.12)}
button:focus-visible,input:focus-visible{outline:3px solid var(--fg);outline-offset:2px}

/* Temps de jeu et chrono */
.gt{display:flex;align-items:center;gap:8px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 12px;font-size:15px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.gt::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--go);box-shadow:0 0 0 3px rgba(43,200,102,.18)}
.gt.off{color:var(--muted)}
.gt.off::before{background:var(--muted);box-shadow:none}
.stage{position:relative;overflow:hidden;text-align:center;border-radius:22px;padding:6px 10px 14px;cursor:pointer;touch-action:manipulation;
  background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line)}
.big{font-family:var(--num);font-weight:800;font-size:clamp(64px,min(15dvh,32vw),150px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.big.long{font-size:clamp(48px,min(11dvh,22vw),104px)}
.sub{min-height:1.3em;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere;letter-spacing:.02em}
.bar{position:absolute;left:14px;right:14px;bottom:7px;height:4px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;background:var(--go);border-radius:inherit;transform-origin:left;transform:scaleX(0)}
.stage.idle .big{color:var(--surface-3)}
.stage.warn .big{color:var(--accent)}
.stage.warn .bar i{background:var(--accent)}
.stage.paused .big{opacity:.4}
.stage.paused .bar i{background:var(--muted)}
.stage.done{background:var(--accent);color:var(--on-accent);border-color:var(--accent);animation:blink .5s steps(1) 6}
.stage.done .sub{color:inherit;font-weight:700}
.stage.done .bar{opacity:0}
@keyframes blink{50%{background:var(--surface);color:var(--fg)}}
/* Table en cours (match Coral), en haut à droite de la carte du chrono ; clignote au changement de table */
.tbadge{position:absolute;top:8px;right:12px;font:700 11px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:4px 8px;pointer-events:none}
.tbadge[hidden]{display:none}
.tbadge.bip{animation:bip .4s steps(1) 5}
@keyframes bip{50%{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}}
@media (prefers-reduced-motion:reduce){.tbadge.bip{animation:none;background:var(--accent);color:var(--on-accent)}}
@media (prefers-reduced-motion:reduce){.stage.done{animation:none}}

/* Équipes et historique */
.mid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);gap:8px;min-height:0}
.side{--tc:var(--t0);--ta:var(--t0-a);--tb:var(--t0-b);--on:var(--on-t0);display:flex;flex-direction:column;gap:6px;min-width:0;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 7px}
.side.s1,.tile.s1{--tc:var(--t1);--ta:var(--t1-a);--tb:var(--t1-b);--on:var(--on-t1)}
.nm{width:100%;min-width:0;height:38px;border:0;border-radius:11px;background:linear-gradient(180deg,var(--ta),var(--tb));color:var(--on);
  font-family:var(--num);font-weight:700;font-size:21px;letter-spacing:.03em;text-align:center;padding:0 4px;text-transform:uppercase}
.lab{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-align:center;line-height:1.1;color:var(--muted);margin-top:2px}
/* Temps morts : deux grandes cases qui prennent la place libre de la carte */
.seg{flex:1 1 auto;min-height:44px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{position:relative;min-height:44px;border-radius:13px;background:var(--bg);border:1.5px dashed rgba(255,255,255,.2);
  font-family:var(--num);font-weight:800;font-size:clamp(28px,5dvh,40px);line-height:1;color:var(--muted)}
.seg button.on{background:linear-gradient(180deg,var(--ta),var(--tb));border:1.5px solid transparent;color:var(--on)}
.seg button.on::after{content:"✓";position:absolute;top:4px;right:6px;font:700 12px/1 var(--font)}
/* Format à un seul temps mort (relais, certains formats Coral) : une seule grande case */
.seg.un{grid-template-columns:1fr}
.seg.un button:nth-child(2){display:none}
.warn-b{height:36px;background:transparent;border:1.5px solid var(--tc);color:var(--tc);font-weight:700;font-size:14px;border-radius:11px;padding:0 4px}
.dots{display:flex;justify-content:center;gap:10px;align-items:center;height:16px}
.dots i{width:13px;height:18px;border-radius:3px;background:var(--surface-3)}
.dots i.on{background:var(--accent);box-shadow:0 0 8px rgba(255,210,63,.45)}
.logwrap{position:relative;min-height:0}
.log{position:absolute;inset:0;margin:0;padding:4px 0;list-style:none;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.log li{padding:7px 10px;font-size:12.5px;line-height:1.25;border-bottom:1px solid var(--line);color:#c9ced5;overflow-wrap:anywhere}
.log li:last-child{border-bottom:0}
.log li:first-child{color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.log .empty{color:var(--muted);border:0;text-align:center;padding-top:14px;font-weight:500}
.log li.empty:first-child{color:var(--muted);font-weight:500;box-shadow:none}

/* Score */
.score{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.8fr) minmax(0,1.15fr);gap:8px}
.tile{--tc:var(--t0);--ta:var(--t0-a);--tb:var(--t0-b);--on:var(--on-t0);position:relative;height:clamp(84px,17dvh,164px);border-radius:20px;
  background:linear-gradient(160deg,var(--ta),var(--tb));color:var(--on);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 18px rgba(0,0,0,.35)}
.tile .pt{position:absolute;inset:0;width:100%;height:100%;background:none;color:inherit;border-radius:20px;font-family:var(--num);font-weight:800;font-size:clamp(56px,min(13dvh,24vw),124px);line-height:1;font-variant-numeric:tabular-nums;padding-top:12px}
.tile .mn{position:absolute;left:6px;bottom:6px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.22);color:inherit;font-size:22px;line-height:1;font-weight:600}
.tile .sets{position:absolute;left:0;right:0;top:8px;display:flex;justify-content:center;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.12em;pointer-events:none}
.tile .sets b{opacity:.75;margin-right:2px}
.tile .sets i{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;opacity:.55}
.tile .sets i.on{background:currentColor;opacity:1}
.centerbtns{display:flex;flex-direction:column;gap:8px}
.y{background:var(--surface-2);color:var(--accent);font-weight:700;border:1px solid rgba(255,210,63,.28)}
.centerbtns .y{flex:1;font-size:16px;line-height:1.1;padding:4px 6px}
.centerbtns .bo{flex:0 0 auto;height:44px;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 10px;font-family:var(--num);font-weight:700;font-size:20px;color:var(--fg);border-color:var(--line)}
.knob{width:38px;height:22px;border-radius:11px;background:var(--surface-3);position:relative;flex:0 0 auto;transition:background .15s}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.bo[aria-pressed="true"] .knob{background:var(--accent)}
.bo[aria-pressed="true"] .knob::after{transform:translateX(16px);background:var(--on-accent)}

/* Commandes */
.ctl{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px}
.ctl button{height:48px;font-size:17px;font-weight:700}
.clr{background:var(--surface-2);color:#d7dbe0;border:1px solid var(--line)}
#newSet{background:linear-gradient(180deg,#ffdc5e,#f5c21b);color:var(--on-accent);border:0}
.stp{background:var(--stop-bg);color:var(--stop);border:1px solid rgba(255,93,93,.35)}
.armed,#newSet.armed{background:#fff!important;color:#111!important;border-color:#fff!important}
.go{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.go.solo{grid-template-columns:1fr}
.go.solo #goB{display:none}
.go button{position:relative;height:clamp(60px,10.5dvh,104px);background:linear-gradient(180deg,var(--go-a),var(--go-b));color:var(--on-go);
  font-family:var(--num);font-weight:800;font-size:clamp(44px,7.5dvh,70px);line-height:1;border-radius:20px;font-variant-numeric:tabular-nums;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 18px rgba(23,165,77,.25)}
.go button small{font-size:.42em;font-weight:700;margin-left:2px;opacity:.75}
.go .hint{display:none;position:absolute;right:10px;top:8px;font:700 10px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;font-style:normal;opacity:.65}
.in-app .go .hint{display:block}
.extra{position:relative;display:grid;grid-template-columns:.8fr 2.2fr 1fr;gap:8px}
.extra>button{height:42px;border-radius:14px;font-size:15px;font-weight:700}
.end90{letter-spacing:.02em;background:var(--surface);border:1.5px solid rgba(43,200,102,.55);color:#9ff0bf}
.x3{background:var(--surface);border:1.5px solid rgba(43,200,102,.55);color:#9ff0bf;font-family:var(--num);font-size:20px!important}
.more{background:var(--surface);border:1px solid var(--line);color:#d7dbe0}
.more::after{content:" ▾";font-size:.8em}
.more[aria-expanded="true"]{background:var(--surface-3)}
.more[aria-expanded="true"]::after{content:" ▴"}
.menu{position:absolute;right:0;bottom:calc(100% + 8px);z-index:5;width:min(280px,100%);display:flex;flex-direction:column;gap:2px;padding:6px;
  background:var(--surface-2);border:1px solid rgba(255,255,255,.12);border-radius:16px;box-shadow:0 14px 34px rgba(0,0,0,.65)}
.menu[hidden]{display:none}
.menu button{display:flex;justify-content:space-between;align-items:center;gap:10px;height:48px;padding:0 12px;background:transparent;border-radius:11px;font-size:15px;font-weight:600;text-align:left}
.menu button b{font-family:var(--num);font-size:21px;font-weight:700;color:var(--accent);white-space:nowrap}

/* Pied */
.foot{display:flex;gap:6px}
.foot button{flex:1 1 0;min-width:0;min-height:34px;font-size:12px;font-weight:600;padding:4px 4px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:#c9ced5}
.foot button[aria-pressed="true"]{background:rgba(43,200,102,.12);border-color:rgba(43,200,102,.35);color:#8be0ab}
.foot button[aria-pressed="false"]{color:var(--muted)}
/* Message : bulle flottante au-dessus des boutons du bas (ne pousse plus la mise en page sur les petits écrans) */
/* posée sur la ligne Vibreur / Son / Tester ; les appuis la traversent (sauf sur un lien) et elle s'efface seule */
.msg{position:fixed;left:12px;right:12px;bottom:max(6px,env(safe-area-inset-bottom,0px));z-index:6;max-width:536px;margin:0 auto;
  padding:9px 12px;border-radius:12px;background:var(--surface-3);border:1px solid rgba(255,255,255,.12);color:#e6e9ee;font-size:12.5px;
  box-shadow:0 8px 24px rgba(0,0,0,.55);white-space:pre-line;pointer-events:none}
.msg a{pointer-events:auto}
.msg a{color:var(--accent);font-weight:700}
.clr:disabled{opacity:.35;cursor:default}
#newSet{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
#newSet.ready{box-shadow:0 0 0 3px rgba(255,210,63,.4);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,210,63,.12)}}
@media (prefers-reduced-motion:reduce){#newSet.ready{animation:none}}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 8px}
.menu .ver{display:block;padding:8px 12px 4px;font-size:12px;color:var(--muted);text-decoration:none}
/* Panneau « Match Coral » : même boîte que le menu */
.panel{gap:8px;padding:12px}
.panel[hidden]{display:none}
.ptitre{font:700 13px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.panel label{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.panel input{flex:1;min-width:0;height:44px;border-radius:11px;border:1px solid rgba(255,255,255,.14);background:var(--bg);color:var(--fg);padding:0 12px;font:600 16px/1 var(--font)}
.panel #cCode{text-transform:uppercase}
.panel #cTable{flex:0 0 76px;text-align:center}.panel label:first-of-type{flex-direction:column;align-items:stretch;gap:6px}
.panel label:first-of-type input{flex:none}
.panel .cgo{justify-content:center;background:linear-gradient(180deg,var(--go-a),var(--go-b));color:var(--on-go);font-weight:800;font-size:16px}
.panel .cferme{justify-content:center;color:var(--muted);height:38px}
.cetat{margin:0;font-size:13px;color:#c9ced5;white-space:pre-line}
.cetat:empty{display:none}
.cetat a{color:var(--accent);font-weight:700}
.nm.long{font-size:17px;letter-spacing:.01em}
.nm.tlong{font-size:14px;letter-spacing:0}
.nm.xlong{font-size:11.5px;letter-spacing:0}
.msg:empty{display:none}

@media (max-height:800px){
  .big{font-size:clamp(56px,min(13dvh,30vw),150px)}
  .centerbtns .bo{height:38px}
  .side{padding:6px;gap:5px}
  .nm{height:32px;font-size:19px}
  .warn-b{height:32px}
  .seg,.seg button{min-height:40px}
  .tile{height:80px}
  .tile .pt{font-size:58px;padding-top:14px}
  .ctl button{height:42px}
  .go button{height:54px;font-size:44px}
  .extra>button{height:36px}
  .foot button{min-height:30px}
}
@media (max-height:680px){
  .app{gap:6px}
  .big{font-size:clamp(48px,min(11dvh,28vw),150px)}
  .nm,.warn-b{height:28px}
  .seg,.seg button{min-height:34px}
  .tile{height:70px}
  .tile .pt{font-size:50px;padding-top:12px}
  .ctl button{height:38px}
  .go button{height:48px;font-size:38px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var $ = function(s){ return document.querySelector(s); };
  // Version du site : dernier chiffre +1 à chaque livraison
  var VERSION = 'V1.0.3';
  var KEY = 'arbitre-baby-v2';
  // Dans l'appli Android, le pont ArbitreApp existe : on affiche l'aide des boutons de volume.
  var inApp = !!window.ArbitreApp;
  if (inApp) document.documentElement.classList.add('in-app');
  var S = {
    n:['Team 1','Team 2'], pts:[0,0], sets:[0,0], to:[0,0], warn:[0,0],
    bo:5, vib:true, snd:true, log:[], gt:{ms:0, run:false, t0:0}
  };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var o = JSON.parse(raw);
      if (o && o.n && o.pts && o.pts.length === 2 && o.gt) { S = o; }
    }
  } catch(e) {}
  if (!S.manches) S.manches = [];
  // Match Coral : S.relais (paliers, élément en cours), S.compo (joueurs par élément), S.clubs, S.tables,
  // S.tm / S.tmDuree (temps morts du format) ; absents = match classique, 2 temps morts de 30 s
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

  /* ---------- Annuler : une photo de l'état avant chaque action ---------- */
  var pile = [];
  function snap(){ pile.push({ s: JSON.stringify(S), t: null }); if (pile.length > 30) pile.shift(); }
  // Retient le chrono lancé par l'action : l'annuler l'arrête aussi
  function lieChrono(){ if (pile.length) pile[pile.length - 1].t = T; }

  /* ---------- Squelette ---------- */
  function sideHTML(i){
    var segs = '';
    for (var k = 1; k <= 2; k++) segs += '<button data-to="'+i+':'+k+'" aria-label="Temps mort '+k+'">'+k+'</button>';
    return '<div class="side s'+i+'">'+
      '<input class="nm" id="nm'+i+'" maxlength="24" aria-label="Nom de l\'équipe '+(i+1)+'">'+
      '<div class="lab">Temps morts</div>'+
      '<div class="seg" role="group">'+segs+'</div>'+
      '<button class="warn-b" data-warn="'+i+'">Avert. '+(i+1)+'</button>'+
      '<div class="dots" id="dots'+i+'"><i></i><i></i><i></i></div>'+
    '</div>';
  }
  function tileHTML(i){
    return '<div class="tile s'+i+'">'+
      '<span class="sets" id="sets'+i+'"></span>'+
      '<button class="pt" data-pt="'+i+'" id="pt'+i+'" aria-label="Ajouter un point">0</button>'+
      '<button class="mn" data-mn="'+i+'" aria-label="Retirer un point">−</button>'+
    '</div>';
  }
  $('#app').innerHTML =
    '<div class="app">'+
      '<button class="gt" id="gt" aria-label="Temps de jeu, toucher pour pause ou reprise">Temps de jeu 0:00</button>'+
      '<section class="stage" id="stage" aria-label="Chrono">'+
        '<div class="big" id="big">--</div>'+
        '<div class="sub" id="sub">Choisis un chrono</div>'+
        '<div class="bar"><i id="bar"></i></div>'+
        '<span class="tbadge" id="tbadge" hidden></span>'+
      '</section>'+
      '<section class="mid">'+ sideHTML(0) +
        '<div class="logwrap"><ol class="log" id="log" aria-label="Historique"></ol></div>'+
        sideHTML(1) +
      '</section>'+
      '<section class="score">'+ tileHTML(0) +
        '<div class="centerbtns">'+
          '<button class="y" id="resetPts">Points à 0</button>'+
          '<button class="y bo" id="bo" aria-pressed="true"><span id="boTxt">Bo5</span><span class="knob"></span></button>'+
        '</div>'+
        tileHTML(1) +
      '</section>'+
      '<section class="ctl">'+

    '</div>';

  function nm(i){ return S.n[i] || ('Team ' + (i + 1)); }
  // Manches à gagner : Bo5 → 3, Bo3 → 2, Bo1 (une seule manche, format Coral) → 1
  function besoin(){ return Math.ceil(S.bo / 2); }
  // Équipe qui a gagné la manche en cours, sinon -1 : 5 points ; à la belle, règle S.regle
  // (par défaut 2 points d'écart, 8 maximum, comme le règlement simplifié FFBF ; sinon celle du format Coral)
  function gagnantManche(){
    if (S.relais) return -1;  // relais : les éléments s'enchaînent tout seuls aux paliers
    var a = S.pts[0], b = S.pts[1], hi = Math.max(a, b), need = besoin();
    var r = S.regle || { win: 5, diff: 2, max: 8 };
    var belle = S.sets[0] === need - 1 && S.sets[1] === need - 1;
    if (a === b) return -1;
    if (!belle) return hi >= 5 ? (a > b ? 0 : 1) : -1;
    if (hi < r.win) return -1;
    if (Math.abs(a - b) < r.diff && !(r.max && hi >= r.max)) return -1;
    return a > b ? 0 : 1;
  }
  // La bulle s'efface seule : 7 s, ou 25 s pour un texte long (résumé à recopier quand la copie a échoué)
  var msgMinuteur = null;
  function effacerMsgDans(ms){
    clearTimeout(msgMinuteur);
    msgMinuteur = setTimeout(function(){ $('#msg').textContent = ''; }, ms);
  }
  function setMsg(t){
    $('#msg').textContent = t || '';

  }

  /* ---------- Relais (format Coral « Race to 30 - D/D/S/S/D »…) ---------- */
  // Un seul score cumulé ; l'élément passe au suivant dès qu'une équipe atteint son palier (6, 12, 18…)
  function typeEl(p){
    var c = (p.cat || '').toLowerCase();
    if (/single|simple/.test(c)) return 'S';
    if (/double|mixed|mixte/.test(c)) return 'D';
    return p.nb === 1 ? 'S' : 'D';
  }
  // Nom court de l'élément k : D1, D2, S1, S2, D3…
  function libEl(k){
    var p = S.relais.paliers, lettre = typeEl(p[k]), n = 0;
    for (var j = 0; j <= k; j++) if (typeEl(p[j]) === lettre) n++;
    return lettre + n;
  }
  // Les cases de nom montrent qui joue l'élément en cours (sinon le club)
  function nomsElement(){
    var c = S.compo && S.compo[S.relais.el];
    for (var i = 0; i < 2; i++) {
      S.n[i] = (c && nomEquipe(i ? c.away : c.home)) || (S.clubs && S.clubs[i]) || S.n[i];
      $('#nm'+i).value = S.n[i];
    }
  }
  function equipe(i){ return S.clubs && S.clubs[i] ? S.clubs[i] : nm(i); }
  function passerElement(){
    var r = S.relais;
    addLog('Fin ' + libEl(r.el) + ' : ' + S.pts[0] + ' - ' + S.pts[1]);
    r.el++;
    if (r.tmType === 'game') S.to = [0, 0];
    nomsElement(); render();
    startTimer(r.pause || 180, 'Entre éléments'); lieChrono();
    addLog('Élément ' + libEl(r.el) + ' : ' + nm(0) + ' contre ' + nm(1) + ' · jusqu\'à ' + r.paliers[r.el].val);
  }
  // Dernier élément : nul à « nul »-« nul » si le format le prévoit, sinon victoire au palier final avec l'écart demandé
  function finRelais(){
    var r = S.relais, a = S.pts[0], b = S.pts[1], hi = Math.max(a, b), val = r.paliers[r.paliers.length - 1].val;
    if (r.nul && a === r.nul && b === r.nul) return 'MATCH NUL ' + a + ' - ' + b;
    if (hi >= val && (Math.abs(a - b) >= (r.ecart || 1) || (r.max && hi >= r.max))) return 'MATCH : ' + equipe(a > b ? 0 : 1) + ' gagne ' + a + ' - ' + b;
    return null;
  }

  /* ---------- Table en cours ---------- */
  // Match sur 2 tables (règle ITSF League) : 1re balle sur la 1re table, puis 2 balles en alternance sur chaque table
  // jusqu'à la fin du match : balles 2-3 sur la 2e table, 4-5 sur la 1re, 6-7 sur la 2e…
  // (c'est le réglage Coral playground_swap « 12 »). Balle n° n = points joués sur tout le match + 1.
  function multiTables(){ return !!(S.tables && S.tables.length === 2); }
  function tableCourante(){
    if (multiTables()) {
      var n = S.pts[0] + S.pts[1] + 1;
      if (!S.relais) S.manches.forEach(function(m){ n += m[0] + m[1]; });
      if (n === 1) return S.tables[0].num;
      return S.tables[Math.floor((n - 2) / 2) % 2 === 0 ? 1 : 0].num;
    }
    return (S.tables && S.tables[0] && S.tables[0].num) || (S.coral && S.coral.comp && S.coral.table) || '';
  }
  function annonceTable(avant){
    var apres = tableCourante();
    if (!multiTables() || !avant || String(avant) === String(apres)) return;
    addLog('Changement de table → ' + apres);
    buzz([150, 80, 150]);
    var tb = $('#tbadge');
    tb.classList.remove('bip'); void tb.offsetWidth; tb.classList.add('bip');
  }

  /* ---------- Journal ---------- */
  function addLog(t){
    S.log.unshift(t);
    if (S.log.length > 60) S.log.length = 60;
    renderLog(); save();
  }
  function renderLog(){
    var ol = $('#log');
    if (!S.log.length) { ol.innerHTML = '<li class="empty">Aucun événement</li>'; return; }
    ol.innerHTML = '';

  }

  /* ---------- Affichage des compteurs ---------- */
  function render(){
    var need = besoin();
    for (var i = 0; i < 2; i++) {
      $('#pt'+i).textContent = S.pts[i];
      // Noms longs (doubles venus de Coral) : police plus petite pour tout voir
      var nmi = $('#nm'+i), ln = nmi.value.length;
      nmi.classList.toggle('long', ln > 8 && ln <= 11);
      nmi.classList.toggle('tlong', ln > 11 && ln <= 16);
      nmi.classList.toggle('xlong', ln > 16);
      if (S.relais) {
        // Relais : élément en cours et son palier (ex. « D2 → 12 »), « FIN » quand le match est terminé
        var rl = S.relais;
        $('#sets'+i).innerHTML = rl.fin ? '<b>FIN</b>' : '<b>' + libEl(rl.el) + '</b>→ ' + rl.paliers[rl.el].val;
        $('#sets'+i).setAttribute('aria-label', rl.fin ? 'Match terminé' : 'Élément ' + (rl.el + 1) + ' sur ' + rl.paliers.length + ', jusqu\'à ' + rl.paliers[rl.el].val);
      } else {
        // Manches : une pastille par manche à gagner, pleine quand elle est gagnée
        var pips = '<b>MANCHES</b>';
        for (var m = 0; m < Math.max(need, S.sets[i]); m++) pips += '<i' + (m < S.sets[i] ? ' class="on"' : '') + '></i>';
        $('#sets'+i).innerHTML = pips;
        $('#sets'+i).setAttribute('aria-label', 'Manches gagnées : ' + S.sets[i]);
      }
      document.querySelectorAll('.seg')[i].classList.toggle('un', (S.tm || 2) === 1);
      var segs = document.querySelectorAll('[data-to^="'+i+':"]');
      for (var k = 0; k < segs.length; k++) {
        segs[k].classList.toggle('on', S.to[i] >= k + 1);
        segs[k].setAttribute('aria-pressed', S.to[i] >= k + 1);
      }
      var dots = $('#dots'+i).children;
      for (var d = 0; d < 3; d++) dots[d].classList.toggle('on', d < S.warn[i]);
    }
    $('#undo').disabled = !pile.length;
    // Manche gagnée : « Nouveau set » devient « Manche NOM » et s'allume (toujours avec confirmation)
    var ns = $('#newSet');
    if (!ns.classList.contains('armed')) {
      var g = gagnantManche();
      ns.textContent = S.relais ? (S.relais.fin ? 'Terminé' : 'Élément →') : g < 0 ? 'Nouveau set' : 'Manche ' + nm(g);
      ns.classList.toggle('ready', g >= 0);
    }
    $('#bo').setAttribute('aria-pressed', S.bo === 5);
    // Relais : « R30 » = course à 30 points
    $('#boTxt').textContent = S.relais ? 'R' + S.relais.paliers[S.relais.paliers.length - 1].val : 'Bo' + S.bo;
    var tb = $('#tbadge'), tn = tableCourante();
    tb.hidden = !tn;
    tb.textContent = 'Table ' + tn + (multiTables() ? ' ⇄' : '');
    $('#vib').setAttribute('aria-pressed', S.vib);
    $('#vib').textContent = S.vib ? 'Vibreur : oui' : 'Vibreur : non';
    // « 12 s partout » (possession 12 s sur toutes les barres à partir de janvier 2027) : un seul gros bouton 12 s.
    // Le 2e bouton reste dans la page (caché) : l'appli Android clique sur [data-t="10"] / [data-t="15"] pour volume + / −.
    var a12 = $('#goA'), b12 = $('#goB');
    a12.dataset.sec = b12.dataset.sec = S.p12 ? '12' : '';
    a12.querySelector('.gval').textContent = S.p12 ? '12' : '10';
    a12.querySelector('.hint').textContent = S.p12 ? 'Vol + / −' : 'Vol +';
    a12.setAttribute('aria-label', 'Chrono ' + (S.p12 ? 12 : 10) + ' secondes');
    $('.go').classList.toggle('solo', !!S.p12);

    $('#snd').setAttribute('aria-pressed', S.snd);
    $('#snd').textContent = S.snd ? 'Son : oui' : 'Son : non';
  }
  for (var q = 0; q < 2; q++) {
    (function(i){
      var inp = $('#nm'+i);
      inp.value = S.n[i];
      inp.addEventListener('input', function(){ S.n[i] = inp.value; save(); render(); });
    })(q);
  }

  /* ---------- Vibreur, son, écran ---------- */
  // Retour haptique très court à l'appui (suit le réglage Vibreur)
  function tic(){
    if (!S.vib) return;
    try { if (navigator.vibrate) navigator.vibrate(18); } catch(e) {}
  }
  function buzz(p){
    if (!S.vib) return null;
    var ok = false;
    try { if (navigator.vibrate) ok = navigator.vibrate(p); } catch(e) { ok = false; }
    return ok;
  }
  var ac = null;
  function unlock(){
    try {
      if (!ac) { var C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch(e) {}
  }
  function beep(){
    if (!S.snd || !ac) return;
    try {
      var t0 = ac.currentTime;
      [0, 0.28, 0.56].forEach(function(d, k){
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = 'square'; o.frequency.value = k === 2 ? 1100 : 880;
        g.gain.setValueAtTime(0.0001, t0 + d);
        g.gain.exponentialRampToValueAtTime(0.3, t0 + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.22);

  }

        }).catch(function(){});
      }
    } catch(e) {}
  }

  /* ---------- Temps de jeu ---------- */
  function gtNow(){ return S.gt.ms + (S.gt.run ? Date.now() - S.gt.t0 : 0); }
  function gtFmt(ms){
    var s = Math.floor(ms / 1000), m = Math.floor(s / 60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  var lastGT = '';
  function renderGT(){
    var t = gtFmt(gtNow());
    var key = t + S.gt.run;
    if (key === lastGT) return;
    lastGT = key;
    var b = $('#gt');
    b.textContent = 'Temps de jeu ' + t + (S.gt.run ? '' : ' · pause');
    b.classList.toggle('off', !S.gt.run);
  }
  function startGT(){
    if (!S.gt.run && S.gt.ms === 0) { S.gt.run = true; S.gt.t0 = Date.now(); save(); }
  }
  $('#gt').addEventListener('click', function(){
    if (S.gt.run) { S.gt.ms = gtNow(); S.gt.run = false; }
    else { S.gt.t0 = Date.now(); S.gt.run = true; }
    save(); renderGT();
  });

  /* ---------- Chrono ---------- */
  var stage = $('#stage'), big = $('#big'), sub = $('#sub'), bar = $('#bar');
  var T = null;
  function fmt(ms){
    var t = Math.ceil(ms / 100), s = Math.floor(t / 10), d = t % 10;
    var main = s >= 60 ? Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60) : String(s);
    return main + '.' + d;
  }
  function curRem(){ return T.paused ? T.rem : Math.max(0, T.end - Date.now()); }
  function renderTimer(){
    if (!T) {
      stage.className = 'stage idle'; big.className = 'big';
      big.textContent = '--'; sub.textContent = 'Choisis un chrono';
      bar.style.transform = 'scaleX(0)';
      return;
    }
    var rem = T.done ? 0 : curRem();
    var txt = fmt(rem);
    big.textContent = txt;
    big.className = 'big' + (txt.length > 5 ? ' long' : '');
    bar.style.transform = 'scaleX(' + (rem / T.total).toFixed(4) + ')';
    var cls = 'stage';
    if (T.done) cls += ' done';
    else if (T.paused) cls += ' paused';
    else if (rem <= 3000) cls += ' warn';
    if (stage.className !== cls) stage.className = cls;
    sub.textContent = T.done ? T.name + ' · temps écoulé'

  function startTimer(sec, name){

    renderTimer();
  });
  $('#stop').addEventListener('click', function(){

  });
  setInterval(function(){ tick(); renderGT(); }, 50);

    if (document.visibilityState === 'visible') { tick(); renderGT(); if (T && !T.done && !T.paused) wake(); }

  /* ---------- Actions ---------- */
  document.addEventListener('click', function(e){
    var b = e.target.closest('button');

    if (d.t || b.closest('.tile, .seg, .warn-b')) tic();

      // data-sec remplace la durée affichée par défaut (réglage « 12 s partout »)
      var sec = +(d.sec || d.t);

      if (d.log) addLog(d.log);
    } else if (d.pt !== undefined) {
      var i = +d.pt, avantT = tableCourante();
      if (S.relais && S.relais.fin) return;
      snap();
      S.pts[i] += 1; render();
      var rl = S.relais;
      if (rl) {
        // Relais : palier atteint → élément suivant (noms, temps morts, pause entre éléments) ; dernier palier → fin
        if (rl.el < rl.paliers.length - 1 && S.pts[i] >= rl.paliers[rl.el].val) {
          pile[pile.length - 1].noms = true;
          addLog('But ' + nm(i) + ' : ' + S.pts[0] + ' - ' + S.pts[1]);
          passerElement(); annonceTable(avantT);
          return;
        }
        var fin = rl.el === rl.paliers.length - 1 && finRelais();
        if (fin) {

          return;
        }
      }
      // Chaque but lance la pause entre les points, 5 s max (règles ITSF art. 7.1.1.1) ;
      // lancée avant le journal pour que le but reste en tête

      var j = +d.mn, avantC = tableCourante();
      if (S.pts[j] > 0) {
        snap();
        S.pts[j] -= 1; render();
        addLog('Correction ' + nm(j) + ' : ' + S.pts[0] + ' - ' + S.pts[1]);
        annonceTable(avantC);
      }
    } else if (d.to) {
      var p = d.to.split(':'), t = +p[0], k = +p[1], duree = S.tmDuree || 30;
      snap();
      if (S.to[t] >= k) { S.to[t] = k - 1; render(); save(); }
      else {
        S.to[t] = k; render();
        addLog('Temps mort ' + nm(t) + ' (' + k + '/' + (S.tm || 2) + ') · ' + duree + ' s');
        startTimer(duree, 'Temps mort ' + nm(t)); lieChrono();
      }
    } else if (d.warn !== undefined) {
      var w = +d.warn;
      snap();
      S.warn[w] = (S.warn[w] + 1) % 4; render();
      if (S.warn[w] > 0) addLog('Avertissement ' + nm(w) + ' (' + S.warn[w] + ')');
      else save();
    }
  });
  $('#end90').addEventListener('click', function(){ startTimer(90, 'Fin de set'); });

  /* ---------- Menu « Autres » (chronos rares) ---------- */
  var more = $('#more'), menu = $('#menu');
  function showMenu(open){ menu.hidden = !open; more.setAttribute('aria-expanded', open); }
  more.addEventListener('click', function(){ showMenu(menu.hidden); });
  // Un choix dans le menu, ou un appui ailleurs, referme le menu
  document.addEventListener('click', function(e){
    if (!menu.hidden && !more.contains(e.target) && (menu.contains(e.target) ? e.target.closest('button') : true)) showMenu(false);
  });
  $('#clear').addEventListener('click', function(){ snap(); S.log = []; renderLog(); save(); render(); });
  $('#bo').addEventListener('click', function(){ snap(); S.bo = S.bo === 5 ? 3 : 5; render(); save(); });
  $('#regle12').addEventListener('click', function(){
    S.p12 = !S.p12; render(); save();
    setMsg(S.p12 ? 'Possession 12 s partout : volume + et volume − lancent 12 s.' : 'Possession 10 s / 15 s.');
  });

  $('#undo').addEventListener('click', function(){
    var e = pile.pop();
    if (!e) return;
    // On garde le temps de jeu, les noms et les réglages tels qu'ils sont maintenant,
    // sauf pour l'annulation d'un match Coral chargé (e.complet) : tout revient comme avant
    // (e.noms : passage d'élément en relais, les noms de l'élément précédent reviennent aussi)
    var cur = S;
    S = JSON.parse(e.s);
    if (!e.complet) S.gt = cur.gt;
    if (!e.complet && !e.noms) S.n = cur.n;
    S.vib = cur.vib; S.snd = cur.snd;
    if (e.t && T === e.t) T = null;
    $('#nm0').value = S.n[0]; $('#nm1').value = S.n[1]; lastGT = '';
    render(); renderLog(); renderTimer(); renderGT(); coralLabel(); save();
  });

  /* ---------- Résumé du match à partager ---------- */
  function resume(){
    var need = besoin(), l = [], c = S.coral;
    l.push('Arbitre Baby · ' + new Date().toLocaleDateString('fr-FR'));
    if (c && c.comp) l.push(c.tournoi + ' · ' + c.comp + (c.phase ? ' · ' + c.phase : '') + ' · table ' + c.table);
    if (multiTables()) l.push('Tables ' + S.tables[0].num + ' et ' + S.tables[1].num + ' (1 balle puis 2 balles en alternance)');
    if (S.relais) {
      var rl = S.relais;
      l.push(equipe(0) + ' ' + S.pts[0] + ' - ' + S.pts[1] + ' ' + equipe(1) + ' (relais à ' + rl.paliers[rl.paliers.length - 1].val + ')');
      l.push('Éléments : ' + rl.paliers.map(function(p, k){ return libEl(k) + ' ' + p.val; }).join(' · '));
      l.push(rl.fin ? 'Match terminé' : 'Élément en cours : ' + libEl(rl.el) + ' (' + nm(0) + ' contre ' + nm(1) + ')');
      l.push('Temps de jeu : ' + gtFmt(gtNow()));
      return l.join('\n');
    }
    if (S.clubs) l.push('Équipes : ' + S.clubs[0] + ' contre ' + S.clubs[1]);
    l.push(nm(0) + ' ' + S.sets[0] + ' - ' + S.sets[1] + ' ' + nm(1) + ' (Bo' + S.bo + ')');
    S.manches.forEach(function(m, k){ l.push('Manche ' + (k + 1) + ' : ' + m[0] + ' - ' + m[1]); });
    if (S.pts[0] || S.pts[1]) l.push('Manche en cours : ' + S.pts[0] + ' - ' + S.pts[1]);
    var w = S.sets[0] >= need ? 0 : S.sets[1] >= need ? 1 : -1;
    if (w >= 0) l.push('Vainqueur : ' + nm(w));
    l.push('Temps de jeu : ' + gtFmt(gtNow()));
    return l.join('\n');
  }
  $('#share').addEventListener('click', function(){
    var txt = resume();
    try { if (window.ArbitreApp && typeof ArbitreApp.share === 'function') { ArbitreApp.share(txt); return; } } catch(e) {}
    if (navigator.share) { navigator.share({ text: txt }).catch(function(){}); return; }
    var copie = function(){ setMsg('Résumé copié : colle-le dans WhatsApp.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(copie, function(){ setMsg(txt); });
    else setMsg(txt);
  });

  function confirmable(btn, armedText, fn){
    var original = btn.textContent, armed = false, to = null;
    // render() remet ensuite le bon libellé (ex. « Manche Nantes » sur Nouveau set)
    function disarm(){ armed = false; btn.classList.remove('armed'); btn.textContent = original; clearTimeout(to); render(); }
    btn.addEventListener('click', function(){
      if (!armed) { armed = true; btn.classList.add('armed'); btn.textContent = armedText; to = setTimeout(disarm, 3500); }
      else { disarm(); fn(); }
    });
  }
  confirmable($('#resetPts'), 'Confirmer ?', function(){
    snap();
    S.pts = [0, 0]; render(); addLog('Points remis à 0');
  });
  confirmable($('#newSet'), 'Confirmer ?', function(){
    var a = S.pts[0], b = S.pts[1], need = besoin(), started = false;
    // Relais : passage manuel à l'élément suivant (si le palier n'a pas été marqué ici) ; rien après la fin
    if (S.relais) {
      if (S.relais.fin) { setMsg('Match terminé : charge le match suivant (Match Coral) ou touche « Tout à zéro ».'); return; }
      if (S.relais.el >= S.relais.paliers.length - 1) { setMsg('C\'est déjà le dernier élément.'); return; }
      snap(); pile[pile.length - 1].noms = true;
      passerElement();
      return;
    }
    snap();
    if (a !== b) {
      var w = a > b ? 0 : 1;
      S.sets[w] += 1;
      S.manches.push([a, b]);
      addLog('Set ' + (S.sets[0] + S.sets[1]) + ' : ' + nm(w) + ' gagne ' + a + ' - ' + b);
      if (S.sets[w] >= need) addLog('MATCH : ' + nm(w) + ' gagne ' + S.sets[0] + ' - ' + S.sets[1]);
      else started = true;
    } else {
      addLog('Nouveau set (égalité ' + a + ' - ' + b + ', aucune manche attribuée)');
    }
    S.pts = [0, 0]; S.to = [0, 0]; S.warn = [0, 0];
    render(); save();
    if (started) { startTimer(90, 'Fin de set'); lieChrono(); }
  });
  confirmable($('#resetAll'), 'Confirmer ?', function(){
    snap();
    S.pts = [0, 0]; S.sets = [0, 0]; S.to = [0, 0]; S.warn = [0, 0]; S.log = []; S.manches = [];
    // On garde le tournoi et la table pour le prochain match Coral, pas le match lui-même
    delete S.regle; delete S.relais; delete S.compo; delete S.clubs; delete S.tables; delete S.tm; delete S.tmDuree;
    if (S.coral) S.coral = { code: S.coral.code, table: S.coral.table };
    S.gt = { ms: 0, run: false, t0: 0 }; lastGT = '';
    T = null; renderTimer(); render(); renderLog(); renderGT(); save();
  });

  /* ---------- Réglages ---------- */
  $('#vib').addEventListener('click', function(){ S.vib = !S.vib; render(); save(); if (S.vib) buzz(120); });
  $('#snd').addEventListener('click', function(){ S.snd = !S.snd; unlock(); render(); save(); if (S.snd) beep(); });
  $('#test').addEventListener('click', function(){
    unlock(); beep();
    var ok = buzz([300, 100, 300]);
    if (ok === null) setMsg('Le vibreur est coupé. Réactive-le avec le bouton « Vibreur ».');
    else if (inApp) setMsg(ok ? 'Vibration envoyée en mode alarme. Si rien ne bouge, vérifie que les vibrations sont activées dans Android.' : 'L\'appli n\'a pas pu faire vibrer le téléphone.');
    else if (!('vibrate' in navigator)) setMsg('Ce navigateur ne gère pas la vibration.');
    else if (ok) setMsg('Chrome a envoyé la vibration au téléphone. Si rien ne bouge, vérifie dans Android : vibrations activées, mode silencieux et Ne pas déranger coupés.');
    else setMsg('Chrome a refusé la vibration (réponse : non).');
  });

  /* ---------- Match Coral (tournoi + table) ---------- */
  // Seule l'appli Android 3+ peut lire la page publique Coral (ArbitreApp.coral) ; réponse dans window.arbitreCoral
  var panneau = $('#coralPanel');
  var coralOk = inApp && typeof ArbitreApp.coral === 'function';
  function coralLabel(){
    $('#coralBtn span').textContent = S.coral && S.coral.table ? 'Match Coral · table ' + S.coral.table : 'Match Coral (tournoi + table)';
  }
  function etatCoral(html){ $('#cEtat').innerHTML = html || ''; }
  function ouvrirCoral(open){
    panneau.hidden = !open;
    if (!open) return;
    $('#cCode').value = (S.coral && S.coral.code) || '';
    $('#cTable').value = (S.coral && S.coral.table) || '';    etatCoral(coralOk ? '' : 'Le match Coral se lit dans l\'appli Android (version 3 ou plus récente). <a href="app.html">Télécharger l\'appli</a>');
  }
  $('#coralBtn').addEventListener('click', function(){ ouvrirCoral(true); });  $('#cFermer').addEventListener('click', function(){ ouvrirCoral(false); });
  document.addEventListener('click', function(e){
    if (!panneau.hidden && !panneau.contains(e.target) && !$('#coralBtn').contains(e.target)) ouvrirCoral(false);
  });
  // Accepte le code seul ou l'adresse Coral collée (…/p/R7LXM7 ou …/t/R7LXM7)
  function codeTournoi(v){
    v = String(v).toUpperCase();
    var m = v.match(/\/[PT]\/([A-Z0-9]{6})/) || v.match(/\b([A-Z0-9]{6})\b/);
    return m ? m[1] : '';
  }
  $('#cGo').addEventListener('click', function(){
    if (!coralOk) return;
    var code = codeTournoi($('#cCode').value), table = parseInt($('#cTable').value, 10);
    if (!code) { etatCoral('Le code du tournoi fait 6 caractères : il est dans l\'adresse de la page Coral (ex. …/p/R7LXM7).'); return; }
    if (!table) { etatCoral('Indique le numéro de ta table.'); return; }
    S.coral = { code: code, table: String(table) }; save(); coralLabel();
    etatCoral('Recherche du match sur la table ' + table + '…');
    ArbitreApp.coral(code, String(table));
  });
  function nomEquipe(l){ return l && l.length ? l.map(function(p){ return p.nom; }).join('/') : ''; }
  // [1,2,3,4,8,9] → « 1 à 4, 8 à 9 »
  function plages(t){
    var out = [], d = t[0], f = t[0];
    for (var i = 1; i <= t.length; i++) {
      if (t[i] === f + 1) { f = t[i]; continue; }
      out.push(d === f ? String(d) : d + ' à ' + f);
      d = f = t[i];
    }
    return out.join(', ');
  }
  window.arbitreCoral = function(r){
    if (!r || r.err) {
      etatCoral(!r || r.err === 'tournoi' ? 'Tournoi introuvable : vérifie le code et la connexion.'
        : r.err === 'table' ? 'Pas de table ' + r.table + ' dans ce tournoi' + (r.tables && r.tables.length ? ' (tables ' + plages(r.tables) + ').' : '.')
        : 'Aucun match en cours, appelé ou à venir sur la table ' + r.table + '.');
      return;
    }
    var m = r.match;
    // Nouveau match : tout repart à zéro (Annuler remet le match précédent, noms compris)
    snap(); pile[pile.length - 1].complet = true;
    S.pts = [0, 0]; S.sets = [0, 0]; S.to = [0, 0]; S.warn = [0, 0]; S.manches = [];
    S.gt = { ms: 0, run: false, t0: 0 }; lastGT = '';
    S.bo = m.bo; S.regle = m.regle;
    // Champs ajoutés par l'APK 4 (absents avec l'APK 3 : match classique, 2 temps morts de 30 s)
    S.tm = m.tm || 2; S.tmDuree = m.tmDuree || 30;
    S.tables = m.tables && m.tables.length ? m.tables : null;
    S.clubs = m.clubs && m.clubs[0] ? m.clubs : null;
    S.compo = m.compo && m.compo.length ? m.compo : null;
    var rel = m.type === 'relay' && m.relais && m.relais.paliers && m.relais.paliers.length ? m.relais : null;
    S.relais = rel ? { paliers: rel.paliers, pause: rel.pause || 180, tmType: rel.tmType, nul: rel.nul || 0, ecart: rel.ecart || 1, max: rel.max || 0, el: 0, fin: false } : null;
    if (rel) { S.tm = rel.tm || S.tm; S.tmDuree = rel.tmDuree || S.tmDuree; }
    // Équipe de club (plus de 2 joueurs) : le nom du club plutôt que la liste de tous les joueurs
    var nomDe = function(l, i){ return (l && l.length && l.length <= 2 && nomEquipe(l)) || (S.clubs && S.clubs[i]) || nomEquipe(l) || ('Team ' + (i + 1)); };
    S.n = [nomDe(m.home, 0), nomDe(m.away, 1)];
    S.coral = { code: r.code, table: r.table, tournoi: r.tournoi, comp: m.comp, phase: m.phase, match: m.id };
    if (S.relais) nomsElement();
    $('#nm0').value = S.n[0]; $('#nm1').value = S.n[1];
    T = null;
    renderTimer(); render(); renderGT(); coralLabel();
    addLog('Coral · table ' + tableCourante() + ' · ' + m.comp + ' : ' + equipe(0) + ' contre ' + equipe(1));
    if (S.relais) addLog('Élément ' + libEl(0) + ' : ' + nm(0) + ' contre ' + nm(1) + ' · jusqu\'à ' + S.relais.paliers[0].val);
    ouvrirCoral(false);
    setMsg((m.statut === 'created' ? 'Match à venir chargé' : 'Match chargé') + ' : ' + m.comp + (m.phase ? ' · ' + m.phase : '') +
      (S.relais ? ' · relais ' + S.relais.paliers.map(function(p, k){ return libEl(k); }).join('/') + ' jusqu\'à ' + S.relais.paliers[S.relais.paliers.length - 1].val : ' · Bo' + m.bo) +
      (multiTables() ? ' · tables ' + S.tables[0].num + ' et ' + S.tables[1].num : ''));
  };
  coralLabel();

  /* ---------- Nouvelle version de l'appli Android ---------- */
  // version.json donne le numéro du dernier APK ; l'APK 1 n'annonce pas sa version
  if (inApp) {
    var apkLocal = 1;
    try { if (typeof ArbitreApp.version === 'function') apkLocal = +ArbitreApp.version(); } catch(e) {}
    fetch('version.json', { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(v){
      if (v.apk > apkLocal) { $('#msg').innerHTML = 'Nouvelle version de l\'appli Android disponible. <a href="' + v.apkUrl + '">Télécharger</a>'; effacerMsgDans(20000); }
    }).catch(function(){});
  }

  render(); renderLog(); renderTimer(); renderGT();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
